[project]
name = "ledger-cli"
version = "0.1.0"
description = "Operator CLI and e2e driver for the Tiny Ledger API (spec §11)."
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "tenacity>=8.2",
  "rich>=13.7",
  "structlog>=24.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "platformdirs>=4.2",
]

[project.scripts]
ledger-cli = "ledger_cli.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff==0.16.1",
  "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "T20"]

[tool.ruff.lint.per-file-ignores]
# Tests print debug context directly; routing it through rich's console is not worth the ceremony.
"tests/**" = ["T20"]

[tool.pyright]
include = ["src/ledger_cli", "tests"]
strict = ["src/ledger_cli"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp is one level, not "tmp/pytest": pytest's basetemp creation does a non-recursive
# mkdir, which fails on a fresh clone on Windows if the parent doesn't already exist (proven —
# see NOTES.md).
addopts = "-m 'not e2e and not live' --basetemp=tmp"
markers = [
  "unit: fast, offline, no network — the default for anything left unmarked",
  "e2e: needs `docker compose up` and the app running locally (spec §9.6)",
  "live: needs an already-deployed environment, not just a local compose stack",
]
