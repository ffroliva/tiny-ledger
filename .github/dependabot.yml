version: 2

# Grouped and capped deliberately. Ungrouped Dependabot opened four PRs on this repository's first
# push, each triggering a full four-container CI run — noise that trains people to ignore the bot,
# which is the opposite of what a dependency gate is for. Grouping means one PR per ecosystem per
# week; the open-PR cap bounds the blast radius when a week is busy.
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        patterns: ["*"]
        # The `actions` group below argues that a dependency which CARRIES a gate must not be
        # reviewed inside a batch diff, because a major can re-default the very input that makes it
        # a gate. That reasoning was never applied here, and this ecosystem has the same shape:
        # sonar-maven-plugin runs `-Dsonar.qualitygate.wait=true`, this pipeline's stage-13 gate.
        #
        # It last moved 5.1.0.4751 -> 5.7.0.6970 as one line inside a routine batch — six minors,
        # including SCANMAVEN-317 / SCANMAVEN-341 (encrypted-property support reworked) and
        # SCANMAVEN-281 (property filtering), against a pom that supplies five `sonar.*` properties.
        # A scanner that quietly stops reading sonar.coverage.jacoco.xmlReportPaths reports 0%
        # coverage: either it reddens the gate, or it passes it on the wrong measurement.
        #
        # Excluded rather than ignored: it still gets proposed, as its own PR, where the diff is the
        # decision. No gate enforces this exclusion — it is a config line, and the `actions` group
        # above rests on the same kind of stated reasoning.
        exclude-patterns:
          - "org.sonarsource.scanner.maven:sonar-maven-plugin"
        update-types: ["minor", "patch"]
    ignore:
      # Majors need a human decision — Testcontainers 1.x -> 2.x was proposed on day one and would
      # very likely have broken the integration suite, being the base of every IT via
      # AbstractIntegrationTest.
      #
      # CORRECTED: this comment used to read "Major bumps land as individual PRs, not in the group",
      # which is not what the block below does. `ignore` SUPPRESSES them — majors are not proposed
      # at all, in a group or otherwise, so the only signal that one exists is somebody noticing.
      # That is a defensible policy and it is not the policy the comment described, which is the
      # kind of gap AGENTS.md asks to be stated rather than left to be discovered.
      #
      # To get the behaviour the old comment claimed, delete this `ignore` block: with the group
      # already restricted to minor+patch, majors then arrive as individual PRs. Left as a decision
      # rather than made silently here.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        # Minor and patch only, matching `maven` and `uv` above — this group used to match `*` with
        # no restriction, so an action MAJOR rode in with the weekly batch.
        #
        # That matters more here than for a library. Two of this pipeline's gates ARE third-party
        # actions: `trivy-action` carries the `exit-code: 1` that makes the image scan fail a
        # required check, and `action-baseline` carries `fail_action: true`. A major of either can
        # rename or re-default the very input that makes it a gate, turning it into a step that
        # reports findings and exits 0 — the defect this repository has already shipped twice (the
        # deleted stage 6, and Sonar before -Dsonar.qualitygate.wait=true). Reviewing that inside a
        # four-action diff is how it goes unnoticed.
        #
        # Measured next door, not hypothesised: the same unrestricted group in ffroliva/agentic-wealth
        # delivered three majors in one PR, including gitleaks-action v2 -> v3.0.0 — a SECRET SCANNER
        # major batched with two routine bumps. It happened to be fine; that run was checked by hand.
        # "We looked this time" is not a process.
        #
        # DELIBERATELY NO `ignore` BLOCK HERE, which makes this ecosystem behave differently from
        # `maven` and `uv`: action majors are not suppressed, they arrive as individual PRs where
        # the diff is the decision. Suppressing them would be the worse failure for this ecosystem
        # specifically — every third-party action in this file is SHA-pinned
        # (WorkflowGovernanceTest enforces it), and a pin that is never bumped is frozen on the
        # commit it was pinned at, indefinitely. For libraries a missed major means staying on a
        # working old version; for a SHA-pinned action it means never receiving a security fix.
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Python CLI (spec §11, implementation-order step 10). `uv` reads pyproject.toml and uv.lock;
  # Dependabot's `uv` ecosystem understands both, so the lock stays authoritative rather than being
  # bypassed by a bare pyproject edit.
  - package-ecosystem: "uv"
    directory: "/ledger-cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
