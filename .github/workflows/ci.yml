name: ci
on:
  # `push` is scoped to main, and `pull_request` covers everything else. Unscoped, the two overlap:
  # a commit on a branch with an open PR triggered BOTH, so every PR ran the whole pipeline twice —
  # two four-container integration stacks, two e2e runs, two Sonar analyses, for one change. Harmless
  # while branches were pushed without PRs; pure waste now that main is protected and every change
  # arrives as one.
  #
  # The trade-off, stated rather than discovered later: a branch pushed with NO open PR now gets no
  # CI at all. Open the PR early — a draft is enough — and it is covered from the first push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      users:
        description: "Concurrent users for the Gatling ramp (§9.7 asks for 500)"
        default: "50"
      rampSeconds:
        description: "Ramp duration in seconds"
        default: "30"

# A fix loop pushes repeatedly. Without this, every superseded commit keeps a four-container stack
# running to report on a revision that has already been replaced. Cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: corretto, java-version: '25', cache: maven }
      - name: "Stage 1 — lint & format"
        # Stage 6 (docs governance) used to run here. Removed 2026-08-06: the check it wrapped
        # scanned the vendored skill's own directory, not this repository, so it reported
        # "17 known, 0 new" whatever changed under docs/. See spec §8.4 and §12.1.
        run: ./mvnw -q spotless:check

  unit:
    needs: gate
    # No Docker required: `verify` starts zero containers **by construction** — surefire's *IT.java
    # exclusion (pom.xml) keeps the containerised suites out — not because any gate asserts it.
    # AGENTS.md: if you state a rule, say which gate enforces it, or say plainly that none does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: corretto, java-version: '25', cache: maven }
      - name: "Stages 2-3 — compile, unit, JaCoCo gates, architecture"
        # Stages 4-5 (OpenAPI contract generation, @standalone Cucumber) run inside verify — the
        # generator and Cucumber's JUnit Platform engine are Maven-bound, not separate steps.
        run: ./mvnw -q verify

      - name: "Unit test count — a green build that ran nothing is not green"
        # `-q` suppresses surefire's summary, so the step above proves only "nothing failed".
        # AGENTS.md trap 4: a pattern matching nothing exits 0. This turns that into a gate.
        # Counts <testcase> elements, not testsuite@tests, because @Nested classes nest suites
        # and double-count. Runs only on success, so the count is always paired with a green exit.
        run: |
          n=$(cat target/surefire-reports/*.xml 2>/dev/null | grep -c '<testcase ' || true)
          echo "UNIT_TESTS=$n"
          echo "### Unit tests: $n" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -eq 0 ]; then echo "::error::surefire produced zero test cases"; exit 1; fi

      - name: "Publish surefire XML"
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: surefire-reports, path: target/surefire-reports/*.xml, if-no-files-found: warn }

      # Handed to the `sonar` job. `if-no-files-found: error` on purpose: a missing report would
      # otherwise reach Sonar as "0% covered" rather than as a broken build, and a coverage number
      # that silently means "nothing was measured" is the failure mode this pipeline exists to refuse.
      - name: "Publish unit coverage"
        uses: actions/upload-artifact@v7
        with: { name: jacoco-unit, path: target/site/jacoco/jacoco.xml, if-no-files-found: error }

  integration:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: corretto, java-version: '25', cache: maven }
      - name: "Stage 7 — integration suite against real Postgres/Redis/Kafka"
        # Named for what it runs, and ONLY what it runs. The old "Stages 7-12" label claimed stages
        # this job never had; the replacement comment then went stale the other way, still saying
        # 8, 9 and 10 "do NOT exist yet" after they landed in this same file. They are jobs below:
        # `cli` (stage 8), `e2e` (stages 9 and 9b), `load` (stage 10, workflow_dispatch-only).
        # Stage 12 (publish) is genuinely unbuilt. Stage 11 (security) is the `security` job.
        # Stage 11 (security): the `security` job below runs gitleaks and now Trivy against the built
        # image (issue #11). `detect-secrets` is deliberately not wired — see that job's summary step.
        run: ./mvnw -q verify -Pit

      - name: "Integration test count — a green build that ran nothing is not green"
        # `-Pit` adds failsafe (pom.xml profile `it`), so the IT counts are in failsafe-reports.
        run: |
          n=$(cat target/failsafe-reports/*.xml 2>/dev/null | grep -c '<testcase ' || true)
          echo "INTEGRATION_TESTS=$n"
          echo "### Integration tests: $n" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -eq 0 ]; then echo "::error::failsafe produced zero test cases"; exit 1; fi

      - name: "Publish failsafe XML"
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: failsafe-reports, path: target/failsafe-reports/*.xml, if-no-files-found: warn }

      # The integration suite produced NO coverage data at all until 2026-08-07: `-Pit` set
      # jacoco.skip=true, which disabled the agent along with the gate it was aimed at. The gate is
      # still off here (it measures the unit suite, which this job skips); only collection is on.
      - name: "Publish integration coverage"
        uses: actions/upload-artifact@v7
        with: { name: jacoco-it, path: target/site/jacoco-it/jacoco.xml, if-no-files-found: error }
      - name: "resolve-drift placeholder"
        run: echo "python CLI drift job lands in Plan 4 (spec §12.1)"

  security:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Stage 11 (partial) — secret scan (gitleaks)"
        # Pinned binary + published sha256, not the marketplace Action: this pipeline's own rule
        # (§12.1 closing note) is that a gate should be reproducible locally — a binary a reviewer can
        # download and run themselves beats an Action of unclear license terms on a private repo. Not
        # offline: the curl below fetches the release on every run, and no binary is vendored here.
        # Pin bump = change both the version and the hash together, deliberately.
        #
        # --no-git scans the files at this commit, not the full git-log history. A history walk would
        # re-flag the same line in every past commit that ever touched it, on every future push,
        # forever — noise that trains people to ignore the gate. Current-tree-only means whatever
        # fails today is fixable today, and a leak that gets deleted in the next commit stops failing.
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --redact -v

      - name: "docker/keycloak/realm-tiny-ledger.json — evaluated, not allowlisted"
        if: always()
        # This fixture seeds six Keycloak test users with one literal password: "dev-only", repeated
        # verbatim six times. Checked against this job's exact pinned ruleset with a real scan run
        # locally before this workflow was written, not assumed: zero findings on this path. The
        # literal is 8 bytes, low-entropy, and reused across every identity — the opposite of what a
        # leaked credential looks like, and below every bundled rule's shape/entropy threshold.
        #
        # Deliberately no allowlist entry for it. There is no active finding here to suppress, and a
        # standing path allowlist would quietly cover any future content pasted into this same file —
        # including a real secret pasted in by mistake. If a rule update ever does start matching it,
        # fix that with either (a) an allowlist naming the specific rule ID, not a blanket file
        # exemption, or (b) swapping the literal for a non-password-shaped fixture value (a boolean
        # "seeded" flag), since the app never authenticates against Keycloak with this string outside
        # local dev anyway.
        run: echo "see workflow comment — no action needed, this is documentation"

      # ---------------------------------------------------------------------------------------
      # Issue #11. Trivy lives HERE, in `security`, rather than in a new `image` job — and that is a
      # decision about whether the gate can bite, not about tidiness.
      #
      # `security` is one of the branch's REQUIRED status checks. A new job would not be, so a
      # CRITICAL finding would have gone red in a check nobody is required to pass, which is the
      # same defect as a scan that exits 0: visible, and unable to stop anything. This pipeline has
      # already shipped that twice (the deleted stage 6, and the Sonar job before
      # -Dsonar.qualitygate.wait=true). Adding a third was the thing to avoid.
      #
      # It cannot go in `unit`: that job runs on a runner with no Docker on purpose (ADR 0003), and
      # build-image drives a Docker daemon build. gitleaks stays above this so the fast secret check
      # still reports first.
      - uses: actions/setup-java@v5
        with: { distribution: corretto, java-version: '25', cache: maven }

      - name: "Stage 11 — build the image, so there is something to scan"
        # The honest excuse this replaces read "no image exists to scan". It was true when written
        # and is false now. Note this does NOT publish: no registry, no credential, no
        # packages:write — publishing is stage 12 and stays a separate decision, so a fork's build
        # still passes.
        run: ./mvnw -q spring-boot:build-image -DskipTests

      - name: "Stage 11 — Trivy image scan"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tiny-ledger:0.1.0-SNAPSHOT
          # Only inputs that DIFFER from the action's defaults are set here. `scan-type: image` and
          # `format: table` are already the defaults (action.yaml@v0.36.0), so stating them adds
          # lines that look like decisions and are not. `severity` (default: everything),
          # `exit-code` (default: none) and `ignore-unfixed` (default: false) are real choices.
          severity: CRITICAL,HIGH
          # THE GATE. Without exit-code the action reports and exits 0, which is a scan that cannot
          # fail — see the comment above for the two this pipeline already shipped.
          exit-code: '1'
          # A deliberate trade, and it has a cost worth stating plainly: a CRITICAL with no
          # available fix is not actionable, and leaving it red would make this job permanently red,
          # which trains people to ignore it. THE CONSEQUENCE IS THAT THIS BUILD CAN BE GREEN WITH
          # KNOWN-UNFIXABLE CRITICALS PRESENT IN THE IMAGE. That is accepted, not overlooked.
          ignore-unfixed: true

      - name: "Stage 11 — what is covered, and what is not"
        if: always()
        run: |
          {
            echo "### Stage 11 (spec §12.1)"
            echo "- gitleaks: above, every push."
            echo "- Trivy: scans the built IMAGE for CRITICAL/HIGH, **exit-code 1**, so it FAILS this"
            echo "  required check. \`ignore-unfixed: true\` means a known-unfixable critical does not"
            echo "  fail the build — the build can be green with such a finding present."
            echo "- Dependency-Check runs in its **own workflow** (\`depcheck.yml\`), nightly and on"
            echo "  \`pom.xml\` changes — not on every push, and not here. It scans the BUILD at"
            echo "  **failBuildOnCVSS=7** including **test-scope** dependencies, the only real gap it"
            echo "  closes over Trivy. That file carries the measurements."
            echo "- **GitHub Dependabot vulnerability alerts are ENABLED** on this repository. They cost"
            echo "  no runner minutes, email on a finding, and match exact package versions rather than"
            echo "  CPE name strings — so they, not \`depcheck\`, are the always-on dependency instrument."
            echo "- Trivy needs NO credential and therefore always runs, so a fork still gets the image"
            echo "  scan while holding no secret."
            echo "- detect-secrets: not added. It covers the same class of finding as gitleaks; running"
            echo "  both without a documented reason (e.g. one catches something the other's ruleset"
            echo "  misses) is redundant scanning, not extra safety."
            echo "- The image is BUILT and SCANNED, never PUBLISHED. Stage 12 stays a separate"
            echo "  decision, so this job needs no registry credential and a fork's build passes."
          } >> "$GITHUB_STEP_SUMMARY"

  # Dependency-Check used to live here. It now has its own workflow, `.github/workflows/depcheck.yml`,
  # triggered nightly and on `pom.xml` changes rather than on every push — the dependency set it scans
  # only changes when that file does, while the NVD feed it scans against changes daily, so those are
  # two different triggers and neither is "every push". That file carries the measurements and the
  # reasoning. Removing it from here takes ~9 minutes off every unrelated push.

  # Stage 8 (spec §12.1) — the Python CLI's own gate. Deliberately needs no Docker: a
  # ruff or pyright failure should not cost a four-container stack to discover.
  cli:
    runs-on: ubuntu-latest
    needs: gate
    defaults:
      run:
        working-directory: ledger-cli
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails on a stale lockfile rather than quietly resolving something else —
      # the Python equivalent of the reproducibility this repo already demands of Maven.
      - name: Sync the pinned environment
        run: uv sync --locked

      - name: Stage 8a — ruff
        run: uv run ruff check .

      - name: Stage 8b — pyright (strict)
        run: uv run pyright

      - name: Stage 8c — unit tests
        run: uv run pytest -v

      # Same guard as the unit and integration jobs: a run that collected nothing exits 0
      # and is indistinguishable from a green one (AGENTS trap 4).
      - name: CLI test count — a green build that ran nothing is not green
        run: |
          n=$(uv run pytest --collect-only -q 2>/dev/null | grep -cE '^tests/' || echo 0)
          echo "### CLI tests collected: $n" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -eq 0 ]; then echo "::error::pytest collected zero tests"; exit 1; fi

  # Stage 9 (spec §12.1) — the five real, unmocked e2e scenarios against a running
  # `full` stack. These tests shipped in f2c9965 and had never executed once: nothing
  # started a Keycloak on 8081 and nothing ran the app as a process. This job is the
  # runtime they were missing.
  e2e:
    runs-on: ubuntu-latest
    needs: [gate, cli]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --wait blocks on the healthchecks. Without it compose returns as soon as the
      # containers exist and the app races Keycloak's realm import.
      - name: Start the full stack (Postgres, Redis, Kafka, Keycloak)
        run: docker compose -f docker/docker-compose.yml up -d --wait

      # Issue #11: the artefact under test is the IMAGE, so this job builds the image rather than
      # the jar. `scripts/e2e/run-e2e.sh` defaults to E2E_MODE=image and brings the `app` compose
      # profile up; E2E_MODE=jar still runs the host jar and is exercised locally.
      #
      # The `image` job below builds the image too, and that duplication is deliberate. The
      # alternative is `docker save` into an artifact, and this image is ~800 MB — uploading and
      # re-downloading it would cost far more than the ~90 s the buildpack takes, and would add a
      # cross-job dependency for no correctness gain. Each job builds what it needs.
      - name: Build the container image
        run: ./mvnw -q spring-boot:build-image -DskipTests

      - name: Sync the CLI environment
        working-directory: ledger-cli
        run: uv sync --locked

      # LEDGER_PASSWORD is the committed TEST FIXTURE credential from
      # docker/keycloak/realm-tiny-ledger.json, which is marked "never deploy". It stays
      # in plain env deliberately: moving a published dev-only value into Secrets would
      # imply it is one.
      #
      # LEDGER_BASE_URL IS NO LONGER SET HERE, and its absence is deliberate. The URL now depends
      # on E2E_MODE — HTTPS through Traefik for the image, plaintext straight to the process for
      # the jar — so the runner owns it and exports it. Two files hardcoding the same URL agreed
      # by accident before; they could not agree now, and the one that knows the topology should
      # be the one that decides.
      #
      # NO CERTIFICATE SECRET. run-e2e.sh runs scripts/tls/gen-dev-ca.sh in-run, so this job
      # produces a throwaway CA from a clean checkout every time — the same principle that keeps
      # the Grafana credential out of CI entirely. CI still holds exactly two secrets, neither
      # of them used by this job.
      - name: Stage 9 — e2e scenarios over HTTPS (image, through Traefik)
        env:
          LEDGER_PROFILE: full
          LEDGER_ISSUER_URI: https://auth.localhost/realms/tiny-ledger
          LEDGER_CLIENT_ID: ledger-test
          LEDGER_USERNAME: alice
          LEDGER_PASSWORD: dev-only
        run: ./scripts/e2e/run-e2e.sh

      # E2E_MODE=jar HAD BEEN RUN BY NOTHING. It was kept when the image landed to avoid silent
      # coverage loss for `java -jar` (README, spec §1.5) — and as wired, it WAS that loss: a
      # branch nobody executed, described in comments as exercised. This step is the fix.
      #
      # A STEP IN THIS JOB RATHER THAN A `strategy: matrix:` LEG, and the reason is not stylistic.
      # A matrix renames the check to `e2e (image)` / `e2e (jar)`, and `e2e` is one of the seven
      # REQUIRED checks on a protected `main`. The named check would then never report and every
      # pull request would block on a job that no longer exists, repairable only by a
      # branch-protection change the repository owner has to make by hand. Same coverage, one
      # check name, no settings change.
      #
      # It runs second and reuses the same backing services. The jar binds host 8080 — free now
      # that the app container has stopped publishing it, which is the collision the backlog
      # warned could otherwise make e2e pass against a stray host JVM.
      - name: Build the runnable jar
        run: ./mvnw -q -DskipTests package

      - name: Stage 9b — e2e scenarios (jar on the host, plaintext)
        env:
          E2E_MODE: jar
          LEDGER_PROFILE: full
          # SAME issuer as the image leg. Keycloak is behind Traefik in BOTH modes — only the
          # application moves to the host jar — so a token minted here carries the same `iss`.
          LEDGER_ISSUER_URI: https://auth.localhost/realms/tiny-ledger
          LEDGER_CLIENT_ID: ledger-test
          LEDGER_USERNAME: alice
          LEDGER_PASSWORD: dev-only
        run: ./scripts/e2e/run-e2e.sh

      # `--profile app` on BOTH, and it is load-bearing rather than cosmetic. Verified on Docker
      # 28.3.0 / Compose v2.38.1: without it `down -v` leaves the profiled container `Up`, prints
      # "Network ... Resource is still in use", and STILL EXITS 0 — a teardown reporting success
      # while the container and network survive. On a reused runner the next `up -d --wait` then
      # races a stale container holding 8080/9090. And the logs step would have been scoped to the
      # four backing services, so the one step whose job is to explain an e2e failure would emit
      # Postgres, Redis, Kafka and Keycloak and nothing from the application.
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml --profile app logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker/docker-compose.yml --profile app down -v

  # Stage 11c (spec §12.1) — OWASP ZAP baseline against the TLS entrypoint.
  #
  # DEFERRED TO THIS COMMIT ON PURPOSE, and the reason is worth keeping: run before Traefik
  # existed, its first report would have been a list of the HSTS, redirect and TLS-version
  # findings that the TLS work was about to configure — a report about an absence rather than
  # about this application. Now the terminator sets those headers, so what ZAP has left to say
  # is about the ledger.
  #
  # A BASELINE, not an active scan: it spiders and reads passively, and never sends an attack
  # payload. That distinction matters against a system of record — an active scan would issue
  # real writes.
  zap:
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      - name: Build the container image
        run: ./mvnw -q spring-boot:build-image -DskipTests

      # NO CERTIFICATE SECRET — a throwaway CA, generated here, in this run.
      - name: Generate the dev CA
        run: ./scripts/tls/gen-dev-ca.sh

      - name: Start the full stack behind Traefik
        run: |
          docker compose -f docker/docker-compose.yml up -d --wait
          docker compose -f docker/docker-compose.yml --profile app up -d app traefik

      # curl, not scripts/e2e/https-check.py, and only because this step can never run anywhere
      # but this runner: ubuntu-latest ships an OpenSSL-backed curl, which honours CURL_CA_BUNDLE
      # for a private CA. The development machine's Schannel build does not, which is the whole
      # reason the e2e path is Python — see that script's header before copying this line anywhere.
      - name: Wait for the application through TLS
        env:
          CURL_CA_BUNDLE: docker/tls/ca.crt
        run: ./scripts/e2e/wait-for.sh https://127.0.0.1/api/v1/accounts 401 120 "tiny-ledger (full, HTTPS)"

      # fail_action: true, and that is the only setting here that makes this a gate. The action
      # defaults it to FALSE — a scan that reports findings and then exits 0 is the same defect as
      # the old Sonar step that submitted an analysis and never read the verdict, and as the
      # deleted stage 6. Accepted findings are downgraded one at a time in .zap/rules.tsv, each
      # naming its rule id and a reason, so what is tolerated is visible in a diff.
      #
      # allow_issue_writing: false — the report is an artifact and a job status. Filing a GitHub
      # issue per run on a PUBLIC repository turns every scan into an inbox item and publishes the
      # findings list to anyone watching, which is the opposite of useful.
      #
      # ZAP runs with --network=host (read out of the action's own dist/index.js at v0.15.0), so
      # 127.0.0.1 here is the runner's loopback and reaches the published Traefik port.
      - name: Stage 11c — OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://127.0.0.1
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml --profile app logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker/docker-compose.yml --profile app down -v

  # Stage 10 (spec §12.1) — Gatling load simulation and JMH benchmarks.
  #
  # workflow_dispatch ONLY, deliberately. A load run is minutes and needs the whole stack;
  # firing it on every push would triple CI time to produce a number nobody reads that
  # commit. §9.7's thresholds are assertions, so this job FAILS when a percentile is
  # missed — see docs/performance-findings.md §2.4, where they currently do fail.
  load:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      # `--profile app` brings Traefik with it, and it is REQUIRED since Keycloak moved behind the
      # proxy: without it nothing listens on 443, every virtual user's token request is refused, and
      # the job reports a §9.7 threshold miss — latency numbers for an unreachable identity provider.
      - name: Generate the dev CA
        run: ./scripts/tls/gen-dev-ca.sh

      - name: Start the full stack behind Traefik
        run: docker compose -f docker/docker-compose.yml --profile app up -d --wait traefik postgres redis kafka keycloak

      # install, not package: benchmarks/ and loadtest/ resolve the app from the local
      # repository, and the `exec` classifier means the plain jar they compile against is
      # the main artifact.
      - name: Build and install the application
        run: ./mvnw -q -DskipTests install

      # -D BEFORE -jar: after it they are application arguments and are silently ignored. The
      # truststore is what lets this host process fetch Keycloak's key set from the HTTPS issuer.
      - name: Start the app under full,load
        run: |
          nohup java \
            -Djavax.net.ssl.trustStore="$PWD/docker/tls/truststore.p12" \
            -Djavax.net.ssl.trustStorePassword=changeit \
            -Djavax.net.ssl.trustStoreType=PKCS12 \
            -jar target/tiny-ledger-0.1.0-SNAPSHOT-exec.jar \
            --spring.profiles.active=full,load > app.log 2>&1 &
          ./scripts/e2e/wait-for.sh http://127.0.0.1:8080/api/v1/accounts 401 120 "tiny-ledger (full,load)"

      - name: JMH benchmarks (§9.7 — event replay, Money arithmetic)
        working-directory: benchmarks
        run: |
          ../mvnw -q clean package
          java -jar target/benchmarks.jar -rf json -rff jmh-result.json

      # Continues on failure so the HTML report and the app log are always uploaded: a
      # threshold breach is exactly the run whose artifacts someone needs.
      - name: Gatling (§9.7 thresholds as assertions)
        id: gatling
        continue-on-error: true
        working-directory: loadtest
        run: >
          ../mvnw gatling:test
          -Dledger.users=${{ inputs.users }}
          -Dledger.rampSeconds=${{ inputs.rampSeconds }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-results
          path: |
            loadtest/target/gatling/**
            benchmarks/jmh-result.json
            app.log

      - name: Fail if a threshold was missed
        if: steps.gatling.outcome == 'failure'
        run: |
          echo "::error::a §9.7 threshold was missed — see the load-results artifact"
          exit 1

      - name: Stop the stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  # SonarCloud. Deliberately LAST and dependent on both test jobs, because its whole value is the
  # coverage those jobs produce — running it early would publish a number measured from nothing.
  #
  # IT IS A GATE, via `-Dsonar.qualitygate.wait=true` on the run step below — see the long comment
  # there for why the flag was added and what went wrong without it. This header said the opposite
  # ("Not a gate... turn it into a gate later by adding -Dsonar.qualitygate.wait=true") until
  # 2026-08-08, contradicting the step it introduces; spec §12.1 carried the same stale claim.
  # The measure-first posture §6 of docs/performance-findings.md takes for mutation coverage was
  # right before a baseline existed. One exists, so this gates.
  sonar:
    needs: [unit, integration]
    runs-on: ubuntu-latest
    # Skips cleanly on forks, where secrets are not available: a PR from a fork would otherwise fail
    # this job for a reason the contributor cannot fix.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs full history for blame — new-code detection and issue authorship are wrong
          # on a shallow clone, and it degrades silently rather than failing.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with: { distribution: corretto, java-version: '25', cache: maven }
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with: { path: ~/.sonar/cache, key: "${{ runner.os }}-sonar", restore-keys: "${{ runner.os }}-sonar" }

      - uses: actions/download-artifact@v8
        with: { name: jacoco-unit, path: target/site/jacoco }
      - uses: actions/download-artifact@v8
        with: { name: jacoco-it, path: target/site/jacoco-it }

      - name: "Both coverage reports must be present"
        # The artifacts are uploaded with if-no-files-found: error, so this is belt and braces — but
        # sonar.coverage.jacoco.xmlReportPaths IGNORES missing files, so without this check a lost
        # artifact would be reported as reduced coverage rather than as a broken pipeline.
        run: |
          for f in target/site/jacoco/jacoco.xml target/site/jacoco-it/jacoco.xml; do
            [ -s "$f" ] || { echo "::error::$f missing or empty — coverage would be understated"; exit 1; }
            echo "$f: $(wc -c < "$f") bytes"
          done

      - name: "Compile without re-running tests"
        # Sonar analyses bytecode as well as source, so the classes must exist. -DskipTests keeps the
        # suites from running a third time; the coverage comes from the artifacts above, not from here.
        run: ./mvnw -q -DskipTests package

      - name: "Stage 13 — SonarCloud analysis"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Keys AND the scanner version live in pom.xml, not here, so `./mvnw sonar:sonar` resolves the
        # same thing locally with a token — this pipeline's rule that a gate be reproducible by hand.
        #
        # Skips rather than fails when the secret is absent, so the pipeline stays green for anyone
        # who clones this repo without a SonarCloud project. The step says so loudly instead of
        # reporting a success it did not earn.
        #
        # `-Dsonar.qualitygate.wait=true` IS THE GATE. Without it `sonar:sonar` only SUBMITS the
        # analysis and exits 0 whatever the verdict — which is exactly what happened: this job reported
        # success on 2026-08-07 while the project's quality gate was ERROR on `new_security_rating`, and
        # the README badge read `quality gate failed` at the same time. A green check that cannot fail
        # is the same defect this pipeline deleted once already as stage 6 (§12.1), and it went
        # unnoticed for the same reason: nothing ever made it go red.
        #
        # The flag makes the scanner poll SonarCloud until the gate is computed and exit non-zero on
        # ERROR. The gate itself is `Tiny Ledger AAA and 85`: A on reliability, security and
        # maintainability, and 85% coverage, asserted on **both new and overall** code — the overall
        # half is deliberate, because that is what the README badges show and a gate that judges only
        # new code lets a badge go red while every build passes.
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN is not set — analysis skipped, NOT passed"
            echo "### Sonar: skipped (no SONAR_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ./mvnw -q sonar:sonar -Dsonar.qualitygate.wait=true
