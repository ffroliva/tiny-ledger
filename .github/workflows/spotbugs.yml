name: spotbugs
# Java SAST: SpotBugs + FindSecBugs (configured in pom.xml, no lifecycle binding — same posture as depcheck.yml).
# Findings go to GitHub code scanning (Security tab, visible to write access only) AND gate this job: the baseline
# is zero after triage, so any finding fails. Accepted patterns live in spotbugs-exclude.xml, each with its reason.
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'pom.xml', 'spotbugs-exclude.xml', '.github/workflows/spotbugs.yml']
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml', 'spotbugs-exclude.xml']

concurrency:
  group: spotbugs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spotbugs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload-sarif only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: corretto, java-version: '25', cache: maven }
      # spotbugs:spotbugs (not :check) writes the SARIF without failing, so the upload always happens; the gate step decides.
      - name: SpotBugs + FindSecBugs
        run: ./mvnw -B -q compile spotbugs:spotbugs
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs
      - name: Gate — FindSecBugs loaded and zero findings
        # Baseline is zero since the 2026-11-12 triage: every remaining pattern is fixed or excluded WITH a reason in
        # spotbugs-exclude.xml. So any finding is new and fails here — after the upload, so it is visible as an alert.
        # The extension check stays: an advisory SAST job that silently loses its plugin reports "0" forever.
        run: |
          python3 - <<'PY'
          import json, sys
          run = json.load(open("target/spotbugsSarif.json"))["runs"][0]
          names = [e.get("name") for e in run["tool"].get("extensions", [])]
          results = run.get("results", [])
          print("SpotBugs extensions:", names, "| results:", len(results))
          for r in results:
              loc = r["locations"][0]["physicalLocation"]
              print(f'::error file=src/main/java/{loc["artifactLocation"]["uri"]},line={loc.get("region", {}).get("startLine", 1)}::{r["ruleId"]}: {r["message"]["text"]}')
          if "com.h3xstream.findsecbugs" not in names:
              sys.exit("FindSecBugs plugin not loaded")
          sys.exit(1 if results else 0)
          PY
