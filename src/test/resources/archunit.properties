# Plan 1 introduces the §9.2 ArchUnit rules (HexagonalRulesTest) before the packages some of
# them govern exist (adapter.out arrives Task 6, application.usecase arrives Task 5). ArchUnit's
# default fail-on-empty-should would otherwise fail those rules for having nothing to check yet,
# even though nothing violates them. This does not weaken any rule: once matching classes exist,
# violations still fail the build exactly as written.
archRule.failOnEmptyShould=false
