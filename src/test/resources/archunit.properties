# WAS `false` throughout Plan 1, deliberately: the §9.2 rules landed before the packages some of
# them govern existed (adapter.out arrived in Task 6, application.usecase in Task 5), and ArchUnit's
# fail-on-empty-should would have failed them for having nothing to check yet. Both packages have
# existed since Plan 1 closed, so that reason is spent.
#
# Now `true`, because once the packages exist the setting cuts the other way. A rule whose `should`
# clause sees ZERO classes passes by default, and that is how an architecture fence dies silently:
# point `@AnalyzeClasses(packages = ...)` at a package that no longer exists — a rename, a typo — and
# every rule in HexagonalRulesTest reports green while enforcing nothing at all. This repository came
# within one commit of exactly that during the 2026-08-05 root-package rename, where five of the
# package references were string literals an IDE rename does not touch.
#
# With this set, an empty match is a failure. A rule can no longer be true merely by being vacuous.
archRule.failOnEmptyShould=true
