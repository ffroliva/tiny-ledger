# The `load` profile — an OVERLAY on `full`, never a run mode of its own.
#
# Activate as `--spring.profiles.active=full,load`. On its own it refuses to boot:
# FailClosedGuard demands a known security posture, and `load` alone is neither
# `standalone` nor `full` (spec §1). That refusal is deliberate and is pinned by a test —
# a profile that raises rate limits must never be capable of running without the security
# posture it is raising them inside.
#
# WHY THIS EXISTS. §9.7 asks for a ramp to 500 concurrent users and asserts p99 write
# < 150 ms, p99 cached read < 20 ms and errors < 0.1%. Against `full`'s production limits
# that measurement is impossible, not merely awkward:
#
#   - ledger.rate-limit.ip-backstop.capacity is 300/minute (application.properties:42) and
#     `ledger.rate-limit.exempt-ips` is EMPTY in `full` — it is set only in
#     application-standalone.properties. A load generator is a single source IP, so the
#     WHOLE application is capped at five requests per second.
#   - ledger.rate-limit.write-per-principal.capacity is 100/minute (:30). Gatling drives a
#     small pool of fixture users, so writes exhaust that bucket in seconds.
#
# The run would drown in 429s long before reaching a latency threshold, and the report
# would describe the limiter rather than the ledger.
#
# WHY RAISE LIMITS RATHER THAN EXEMPT THE GENERATOR'S IP. `exempt-ips` is matched with an
# exact string against getRemoteAddr() (RateLimitFilter:125-132, no CIDR), so exempting a
# containerised generator means guessing a Docker bridge address that changes between
# environments. Raising a number by configuration is reproducible; guessing an IP is not.
# It also keeps the limiter *in the path* — still bucketing, still spending Redis round
# trips — so the measurement includes the limiter's own cost, which production pays too.
# An exemption would measure a system that does not exist.
#
# These numbers are headroom, not targets. Nothing asserts against them; they exist so the
# §9.7 assertions measure the ledger. Production defaults in application.properties are
# untouched and this file is never active in a deployment.

# 500 concurrent users writing: 500 * 60 = 30000/min is the theoretical ceiling at one
# write per user per second. Doubled, so a burst scenario cannot clip against it.
ledger.rate-limit.write-per-principal.capacity=60000
ledger.rate-limit.write-per-principal.period=60s

ledger.rate-limit.read-per-principal.capacity=120000
ledger.rate-limit.read-per-principal.period=60s

# The generator is one source IP, so this bucket sees every request from every user.
# It must exceed the sum of the per-principal buckets or it becomes the binding limit.
ledger.rate-limit.ip-backstop.capacity=500000
ledger.rate-limit.ip-backstop.period=60s

# Unauthenticated traffic is not part of §9.7's scenarios; left at its production value
# deliberately, so an accidental unauthenticated flood during a load run is still refused.
