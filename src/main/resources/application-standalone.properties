server.address=127.0.0.1
# ADR 0005 / spec 6.6. This line is NOT redundant with the one above, and it must NOT be copied into
# `full`. ManagementWebServerFactoryCustomizer applies management.server.address unconditionally, so
# application.properties declaring only management.server.port overwrites the parent's 127.0.0.1 bind
# and leaves standalone's probe listener on 0.0.0.0 -- the opposite of what the line above buys.
# In `full` the kubelet dials the pod IP, so pinning loopback there would fail every httpGet probe.
management.server.address=127.0.0.1
# No database in standalone. The first three fire purely because the `full` profile put the JDBC
# driver and Modulith's event-publication store on the classpath, and both hard-require a
# DataSource: without the exclusions the standalone context fails to start.
# Spec v3.5 sec 4.3 governs the consequence -- `balance` keeps a plain synchronous @EventListener here.
# The fourth (sec 6.5, /error's path leak) is a straight copy of application.properties's own
# declaration, not a second reason: spring.autoconfigure.exclude REPLACES rather than appends
# (AGENTS.md trap 6), so a profile file that declares this key at all must restate every entry the
# base file would otherwise have contributed, or lose them silently. Measured: without this line
# repeated here, `full`'s exclusion of ErrorMvcAutoConfiguration is shadowed under `standalone` and
# GET /error keeps answering with BasicErrorController's {"status":999,"error":"None"} shape.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.modulith.events.jdbc.JdbcEventPublicationAutoConfiguration,\
  org.springframework.modulith.events.config.EventPublicationAutoConfiguration,\
  org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration

# sec 6.1: combined with server.address above (every request is 127.0.0.1, loopback-only bind, no
# remote caller can ever reach it) and standalone's fixed identity (CallerPrincipal is always
# `local`, so there is no per-principal bucket to fall back on either), this line makes rate
# limiting FULLY INERT in standalone, not merely relieved of the 300/minute backstop ceiling. Every
# request in this mode skips both buckets entirely. That is the product-owner ask, and the blast
# radius is nil for exactly the loopback-bind reason above -- but read this line as "sec 6.1 does not
# apply here", not as "standalone is rate-limited at a higher number."
# Trap 6 checked both directions before adding this: neither application.properties nor this file
# already declares ledger.rate-limit.exempt-ips (it is a new key, unlike the exclude list above), so
# there is nothing here to shadow and nothing in the base to be shadowed. `full` deliberately gets no
# entry -- see RateLimitProperties's javadoc for why a loopback default would be dangerous there.
ledger.rate-limit.exempt-ips=127.0.0.1

# SS6.5: the per-owner account cap is OFF here, and that is not a relaxation of the rule.
# `standalone` authenticates nobody and runs as one fixed principal, so a cap per OWNER would be a
# cap on the whole system -- 10 accounts total, then the tutorial stops working. `full` carries the
# real value (application.properties). Same code path in both modes; only the number differs.
ledger.accounts.max-per-owner=-1
