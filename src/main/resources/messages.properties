# SS6.5: the human-readable half of the error catalogue -- the `detail` of every RFC 7807 problem.
# Keys are derived from ErrorCode.messageKey(), never declared twice; ErrorCodeTest pins this file
# to the enum in BOTH directions, so a new code with no message and an orphan key are equally red.
#
# NO APOSTROPHES. Spring runs a message through MessageFormat as soon as the exception carries args,
# and there a single quote opens a quoted section: "the account's" would silently swallow the rest.
# Codes with args today are forbidden, version-conflict, account-not-found, idempotency-conflict and
# account-limit-reached, but the rule is applied to every line so a later arg cannot break one.
#
# WHAT MAY GO IN A DETAIL: what the caller already knows or supplied. Not stream versions, not the
# resolved principal, not anything that would tell an unauthorised caller something new (SS6.5).
# Only account-limit-reached interpolates -- {0} is the configured cap, which the caller needs in
# order to act on the refusal.
problem.invalid-amount=The request is malformed. minorUnits must be a positive integer and currency a valid ISO-4217 code.
problem.unauthenticated=No valid credential was presented.
problem.forbidden=You do not have access to this account.
problem.account-not-found=No such account.
problem.idempotency-conflict=This movement UID already identifies a different movement.
problem.version-conflict=The account stream moved on. Retry the command.
problem.account-limit-reached=You already hold the maximum of {0} accounts.
problem.currency-mismatch=The amount currency differs from the account currency.
problem.insufficient-funds=The account balance is lower than the requested withdrawal.
problem.asset-mismatch=Asset class or symbol mismatch.
problem.insufficient-holding=The account asset holding is lower than the requested transfer.
problem.rate-limit-exceeded=Too many requests. Retry after the interval in the Retry-After header.
problem.not-available-in-standalone=The auditor operations require the full profile.
problem.event-store-unavailable=The event store is unreachable. Retry after the interval in the Retry-After header.
