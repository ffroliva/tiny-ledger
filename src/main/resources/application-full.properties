spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# docker/docker-compose.yml's published ports. AbstractIntegrationTest overrides all three via
# @DynamicPropertySource for the *IT suites, so these are only live for a real `full` boot.
spring.datasource.url=jdbc:postgresql://localhost:5432/tiny_ledger
# Environment references, not literals. The values are the docker-compose fixture and are not secret
# — but this repository is PUBLIC, and a bare `password=` assignment in a properties file is the
# pattern that makes a *real* one look unremarkable when someone pastes it here later. That is the
# same reasoning ci.yml already gives for refusing to allowlist the Keycloak realm file by path.
#
# Defaults are kept so `./mvnw spring-boot:run -Dspring-boot.run.profiles=full` still works against
# Compose with no setup (spec §1.5). A real deployment overrides both from its own secret store; the
# integration suite overrides them again through @DynamicPropertySource and never reads these.
spring.datasource.username=${TINY_LEDGER_PG_USER:ledger}
spring.datasource.password=${TINY_LEDGER_PG_PASSWORD:ledger}
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Measured 2026-08-07 by RedisOutageIT (E10), the first time a real Redis outage was ever exercised:
# a write took 64 SECONDS. `RedisBalanceCache.evict` behaved exactly as designed — it caught the
# DataAccessException and refused to roll a movement back over a cache — but Boot's default timeout
# here is 60s, so the correct failure took a minute to arrive. `BalanceProjector.on` evicts inside
# the still-open append transaction, so that minute is spent holding a Tomcat worker on EVERY write
# for the duration of the outage.
#
# That is the exact worker-pool saturation RateLimitConfig's javadoc says its own 250ms exists to
# prevent, and it went unnoticed because that reasoning was applied to the rate limiter's hand-built
# RedisClient and not to this one — two Redis clients on one request path, only one of them bounded.
# Same value for the same reason: long enough for ordinary jitter to a same-network Redis, short
# enough that an outage costs a bounded stall per request rather than a minute.
spring.data.redis.timeout=250ms
spring.data.redis.connect-timeout=250ms
spring.kafka.bootstrap-servers=localhost:9092

# §6.4: the resource server's trust anchor. FailClosedGuard treats this key as a full-mode marker —
# its presence under the standalone profile is a refusal to start, not a warning.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${LEDGER_ISSUER_URI:http://localhost:8081/realms/tiny-ledger}
# Task 3: without this, any token the issuer above mints is accepted, including one minted for an
# unrelated client — issuer-uri alone proves who signed the token, not who it was signed for. Boot
# 4.1's JwtDecoderConfiguration#getValidator (spring-boot-security-oauth2-resource-server-4.1.0,
# measured by decompiling the shipped jar rather than assumed from 6.x docs) adds a JwtClaimValidator
# on "aud" to the SAME auto-configured decoder whenever this list is non-empty — no JwtDecoder bean,
# so SecurityConfig needs no change and the single Spring context AbstractIntegrationTest builds
# (ADR 0003) stays exactly that.
spring.security.oauth2.resourceserver.jwt.audiences=${LEDGER_AUDIENCE:tiny-ledger-api}

# ADR 0001: Modulith owns the relay. DELETE means the publication row goes the moment Kafka
# acknowledges — the queue only ever holds in-flight and failed work, so it needs no purge job
# and no partitioning. The permanent record is the `events` table, not this one.
spring.modulith.events.completion-mode=DELETE
# Spec §12: one schema authority. The event_publication table is changeset 004, not a second
# initializer racing Liquibase for the same DDL.
spring.modulith.events.jdbc.schema-initialization.enabled=false
# Spec §4.3: off by default, so set explicitly — a crash between the event commit and the Kafka
# ack must be re-published on restart rather than lost.
spring.modulith.events.republish-outstanding-events-on-restart=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Modulith serializes the event itself and hands KafkaTemplate a byte[]; the consumer still reads
# it as a String because those bytes are UTF-8 JSON.
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=tiny-ledger-audit
spring.kafka.consumer.auto-offset-reset=earliest
