spring.profiles.default=standalone
spring.mvc.problemdetails.enabled=true
# spec 3/sec 4.5: config and platform are not application modules -- only explicitly
# @ApplicationModule-annotated packages (ledger, balance, audit, notification, shared)
# participate in the module graph.
spring.modulith.detection-strategy=explicitly-annotated
# spec 3/P8: large-movement notification threshold, minor units (10 000.00)
ledger.notification.large-movement-minor-units=1000000
# spec 6.5: reject non-integer minorUnits (e.g. 100.5) with 400 instead of silently truncating
spring.jackson.deserialization.accept-float-as-int=false
# spec 6.5: BasicErrorController's default /error shape echoes the request path, an internal
# identifier -- SecurityConfigIT#anErrorDispatchDoesNotEchoTheRequestPath measured it verbatim in the
# body. True in both run modes, so it is declared here as the base value for `full` (which sets no
# spring.autoconfigure.exclude of its own). Measured -- trap 6 in AGENTS.md -- that this alone is NOT
# enough for `standalone`: application-standalone.properties already declares this same property with
# three entries of its own, profile-specific properties REPLACE rather than merge with the base for
# the same key, so under `standalone` this line would be entirely shadowed and BasicErrorController
# would stay live there. application-standalone.properties therefore repeats this exact entry as a
# fourth item in its own list -- keep the two in sync if either changes.
# SecurityProblemHandler still answers the security chain's own 401/403 -- this exclusion only removes
# the framework's fallback for a request that reaches DispatcherServlet without ErrorHandlingAdvice or
# SecurityProblemHandler ever having translated it (see SecurityProblemHandler's javadoc for why those
# two do not already cover this).
spring.autoconfigure.exclude=org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration

# spec 6.1: the table's own numbers, true in both run modes -- only the bucket *storage* differs
# by profile (RateLimitConfig: local/Caffeine in standalone, Redis/lettuce in full). Scalar values,
# not a list, so neither key is subject to trap 6 (AGENTS.md) -- a profile file that never mentions
# these names leaves them exactly as declared here.
# SS6.5: how many accounts one principal may self-open. A valid `ledger:writer` token is
# permission to write, never an unlimited entitlement to create -- opening is a bank decision.
# THE ONLY PLACE THIS NUMBER IS WRITTEN. Every other mention names the property, not the value,
# so raising it is a one-line change. Negative disables the rule; `standalone` and the test
# contexts do that, because a per-OWNER cap where there is one principal caps everything.
# Raising is always safe. LOWERING strands owners already above the new cap: their accounts keep
# working and they simply cannot open another, which is the correct behaviour for a cap on
# OPENING rather than on holding.
ledger.accounts.max-per-owner=2
ledger.rate-limit.write-per-principal.capacity=100
# burst is a verified no-op: RateLimitFilter#probe builds the Bandwidth from capacity() alone, and
# `grep "burst()"` over src/main returns zero call sites. Kept at 20 (not 0, unlike the other three
# burst lines below) only because sec 9.3 N9 requires the 101st write refused, not the 121st -- see sec 6.1.
ledger.rate-limit.write-per-principal.burst=20
ledger.rate-limit.write-per-principal.period=60s
ledger.rate-limit.read-per-principal.capacity=1000
ledger.rate-limit.read-per-principal.burst=0
ledger.rate-limit.read-per-principal.period=60s
ledger.rate-limit.unauthenticated-per-ip.capacity=20
ledger.rate-limit.unauthenticated-per-ip.burst=0
ledger.rate-limit.unauthenticated-per-ip.period=60s
ledger.rate-limit.ip-backstop.capacity=300
ledger.rate-limit.ip-backstop.burst=0
ledger.rate-limit.ip-backstop.period=60s

# -- The X-Forwarded-For trust boundary. Read sec 6.1's "client IP is getRemoteAddr(), never a raw
# X-Forwarded-For" first: THIS is what makes that sentence true once a proxy is in front.
#
# Traefik terminates TLS (docker/traefik/, docs/security-material.md), so every request now reaches
# the application from the PROXY's address. Without the two lines below, IpBackstopFilter would meter
# all traffic as one source and the backstop would be useless. With the wrong two lines it is worse
# than useless: an application that trusts the header from anywhere lets any caller put any address
# in it and mint a fresh 300/minute bucket per request -- adding TLS would have quietly REMOVED a
# control rather than added one.
#
# `native`, NOT `framework`, and the choice is the control. Read out of the shipped jars:
#   framework -> ForwardedHeaderFilter, which has NO trusted-proxy concept at all and processes
#                X-Forwarded-* from any peer. It is the setting that creates the hole.
#   native    -> Tomcat's RemoteIpValve, which rewrites remoteAddr ONLY when the directly connected
#                peer already matches internal-proxies. That is the whole mechanism.
# TomcatWebServerFactoryCustomizer#customizeRemoteIpValve (spring-boot-tomcat-4.1.0-sources.jar)
# adds the valve when this strategy is set and passes internal-proxies straight through.
server.forward-headers-strategy=native
# BOOT'S DEFAULT FOR THIS PROPERTY IS UNSAFE HERE, which is why it is declared rather than left
# alone. It is:
#   192.168.0.0/16, 172.16.0.0/12, 169.254.0.0/16, fc00::/7, 10.0.0.0/8, 100.64.0.0/10,
#   127.0.0.0/8, fe80::/10, ::1/128
# and 172.16.0.0/12 is the range Docker hands to Compose networks -- so the default trusts EVERY
# container on the network, and on a Kubernetes pod network every pod. This names one address: the
# static one docker-compose.yml pins Traefik to, which is why that file declares a subnet at all.
#
# The default below is safe in every shape this repository actually runs. A jar on a host is dialled
# from 127.0.0.1, which does not match, so the header is ignored entirely -- exactly what an
# unconfigured deployment must do. A real deployment overrides LEDGER_TRUSTED_PROXIES with its own
# ingress address; docker-compose.yml sets it explicitly rather than relying on this default, so
# moving Traefik's address cannot silently un-trust it.
#
# ForwardedHeaderSpoofingTest and ForwardedHeaderTrustedProxyTest are the gate, and they are
# differential: the identical two requests score opposite outcomes either side of this one value.
server.tomcat.remoteip.internal-proxies=${LEDGER_TRUSTED_PROXIES:10.89.0.250}

# spec 6.6 / ADR 0004, and see the "Endpoint exposure" assessment in
# docs/spec.md section 6.6 for the per-endpoint reasoning.
# Health ONLY: heapdump would dump balances and bearer tokens, env and configprops would render the
# issuer-uri and datasource URL, loggers is a runtime write, httpexchanges is PII. This is a
# bearer-token API with no browser surface, so every additional endpoint is attack surface bought for
# nothing. Metrics leave over OTLP in part 2 of step 9, deliberately not over a scrape endpoint --
# that would be a second path to the same data and a second thing to secure.
#
# This line is layer 1 of 2: anything absent here is never web-mapped. SecurityConfig's denyAll on
# the management chain is layer 2, and it is what keeps a future edit to THIS line from silently
# opening an endpoint to any valid token. Do not treat either as redundant.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Never, for every caller, authenticated or not: the probe body is {"status":"UP"} and nothing more.
# Which component is down is answerable from ledger.outbox.pending.age.seconds and the logs, by people
# who already have access to them. `when-authorized` behind a new ledger:operator role was considered
# and rejected -- a fourth role and a Keycloak realm change for detail those people can already reach.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# The readiness group is declared EXPLICITLY, and the omissions are the point. Boot auto-configures a
# `redis` indicator and a default group would include it -- which would contradict E10 (the ledger must
# keep serving while Redis is down). `standalone` has no datasource, so the base value is
# readinessState alone; application-full.properties adds `db`. See ADR 0004.
#
# `kafka` is excluded by intent and NOT by this line: there is no Kafka health contributor on this
# classpath, so naming it here would fail at context startup rather than exclude anything. E11 is
# protected by that absence, which a Boot upgrade could remove without any test noticing.
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.liveness.include=livenessState

# ADR 0005: Kubernetes is the production target. Probes bind to their own port, unpublished, so a
# misconfigured endpoint is unreachable rather than merely denied. 0 is NOT used here -- a fixed port
# is what a manifest references; the tests override it to 0 for a random free port.
management.server.port=9090
# ADR 0005 / spec 6.6: standalone ALSO pins the address (application-standalone.properties).
# ManagementWebServerFactoryCustomizer applies management.server.address unconditionally, so declaring
# only the port overwrites the parent's bind and would give standalone a 0.0.0.0 listener. Do NOT pin
# it in `full`: the kubelet dials the pod IP, so a loopback bind would fail every httpGet probe.

# ADR 0005, and this is a CORRECTNESS property for a ledger rather than an operational nicety. On
# SIGTERM the instance must leave the load balancer before the listener stops. Without graceful
# shutdown, in-flight writes die mid-request during an ordinary rolling deploy or scale-down. Boot
# flips readiness to OUT_OF_SERVICE on shutdown, which is what the orchestrator reads.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# ADR 0005: without these, twenty replicas emit one indistinguishable stream and "which instance is
# slow" has no answer. Environment-sourced, never hardcoded.
#
# CORRECTED at part 2 (spec v3.41), and the correction is not cosmetic. Part 1 declared the latter
# two under `management.observations.key-values.*`, which adds common key-values to every
# OBSERVATION -- they become span tags and METER tags, not OTel resource attributes. Boot reads
# resource attributes from `management.opentelemetry.resource-attributes.*`, and
# `spring.application.name` supplies service.name on its own.
#
# The meter half was the real defect. service.instance.id defaults to ${random.uuid}, a fresh value
# per process, so as a meter tag it mints one permanent time series per restart and per replica --
# precisely the one-way door sec 6.6's cardinality rule names, written in by the pass that quoted the
# rule. NO GATE ENFORCES THIS. It was found by reading Boot 4.1's configuration metadata, not by any
# test failing, which is exactly why sec 6.6 says the rule is a review rule and says so out loud.
spring.application.name=${LEDGER_SERVICE_NAME:tiny-ledger}
management.opentelemetry.resource-attributes.service.namespace=${LEDGER_SERVICE_NAMESPACE:local}
management.opentelemetry.resource-attributes.service.instance.id=${LEDGER_INSTANCE_ID:${random.uuid}}

# -- sec 14 step 9 part 2: OTLP export, OFF by default -----------------------------------------------
# Spec 6.6: with the `observability` Compose profile inactive there is nothing listening on 4318,
# and an enabled exporter would fill the log with failed-export retries against a port no one holds.
# Spans and meters are still CREATED -- that is what puts trace_id and span_id on every log line and
# gives sec 9.4's assertions something to read. Only the shipping is off.
#
# These are the Boot 4.1 property names, read out of each jar's spring-configuration-metadata.json.
# The `management.otlp.tracing.*` spelling most documentation still shows is the DEPRECATED alias;
# the live names are below, and the endpoints are set only by the tests and by a real deployment.
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

# Spec 6.6: 100% at the application, thinned at the Collector. Boot's default is 0.1, which would
# silently discard nine spans in ten -- including every one sec 9.4 asserts on. Tail sampling belongs at
# the Collector because only it can see whether a trace ended in an error
# (docker/otel-collector.yaml); a head sampler discards errors at exactly the same rate as
# successes, which is backwards.
management.tracing.sampling.probability=1.0

# sec 6.6's "every line carrying trace_id and span_id", plus the one Boot's default pattern would drop.
# Boot's default correlation pattern is [appName,traceId,spanId]; the FAPI interaction id had been
# riding in MDC under `traceId` and was evicted when Micrometer Tracing took that key over (see
# FapiInteractionIdFilter). Without this line the interaction id would still reach the JSON logs in
# `full` -- which carry the whole MDC -- but would vanish from the console a human actually reads,
# quietly falsifying that filter's javadoc. Three ids, one bracket.
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{interactionId:-}]

