apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tiny-ledger-netpol
  labels:
    app.kubernetes.io/name: tiny-ledger
    app.kubernetes.io/part-of: tiny-ledger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tiny-ledger
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic to application port from any ingress/pod in cluster
    - ports:
        - protocol: TCP
          port: 8080
    # Management port. THIS RULE HAS NO `from:` SELECTOR, so it admits every pod in the cluster —
    # not only the kubelet and Prometheus an earlier version of this comment named. The wording is
    # corrected rather than the rule narrowed, because the narrowing is not free: kubelet probes
    # originate from the NODE address, not from a pod, so a podSelector/namespaceSelector here
    # silences liveness and readiness on the CNIs that enforce node-to-pod traffic, and the ipBlock
    # that would keep them working has to name a node CIDR this repository cannot know.
    #
    # What actually bounds this port is not the policy: SecurityConfig#managementChain permits
    # exactly /actuator/health/liveness and /actuator/health/readiness and denyAll()s the rest, the
    # Service is ClusterIP so nothing outside the cluster reaches it, and docker-compose.yml refuses
    # to publish 9090 for the same reason. This rule is the outermost of those three, and it is the
    # loosest — worth knowing before someone reads it as the control.
    #
    # Found by BootUI's pentest advisor (PT-A05-043) during the 30 Aug 2026 evaluation: it flagged
    # the management connector as potentially externally reachable, and the finding was mitigated
    # everywhere the comment claimed except here.
    - ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow DNS resolution (kube-dns / CoreDNS)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow PostgreSQL (5432)
    - ports:
        - protocol: TCP
          port: 5432
    # Allow Redis (6379)
    - ports:
        - protocol: TCP
          port: 6379
    # Allow Kafka (9092, 29092)
    - ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 29092
    # Allow Keycloak / OAuth / JWKS (8080, 8443, 443)
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 443
    # Allow OpenTelemetry Collector (4317 gRPC, 4318 HTTP)
    - ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
