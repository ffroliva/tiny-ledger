apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tiny-ledger-hpa
  labels:
    app.kubernetes.io/name: tiny-ledger
    app.kubernetes.io/part-of: tiny-ledger
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tiny-ledger
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
