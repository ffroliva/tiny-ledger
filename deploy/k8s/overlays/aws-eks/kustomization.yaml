apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tiny-ledger

resources:
  - ../../base
  - serviceaccount.yaml
  - ingress.yaml

patches:
  - target:
      kind: Deployment
      name: tiny-ledger
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: tiny-ledger-sa
