# `full`-profile dependencies — Postgres, Redis, Kafka (KRaft, no ZooKeeper) and Keycloak. Image
# tags match AbstractIntegrationTest's Testcontainers so compose and the ITs exercise the same
# versions. The app itself is still NOT a service here: run it on the host against these published
# ports, e.g.
#   docker compose -f docker/docker-compose.yml up -d --wait
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=full
# `--wait` blocks on the healthchecks; without it compose returns as soon as containers exist,
# and the app races Keycloak's realm import.
name: tiny-ledger

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tiny_ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      # Overridable because 5432 is the most contested port on a developer machine, and
      # the failure mode is worse than a refused bind: the app's datasource URL is a fixed
      # localhost:5432, so if another Postgres already holds the port, this container stays
      # in `Created` and the app connects to THAT database instead. It is caught today only
      # because the credentials differ — an unrelated instance with a ledger/ledger user
      # would be read and written silently. Set TINY_LEDGER_PG_PORT and scripts/e2e/run-e2e.sh
      # points the app at the same value.
      - "${TINY_LEDGER_PG_PORT:-5432}:5432"
    # The event store is the system of record: without a named volume `docker compose down` deletes it.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d tiny_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.9.9
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft broker+controller — no ZooKeeper.
      #
      # TWO client listeners, and issue #11 is why. Until the app became a service below, only the
      # HOST talked to this broker, so one listener advertised as `localhost:9092` was enough and was
      # what this file had. That advertisement is actively wrong for an in-network client: a Kafka
      # client bootstraps, receives the ADVERTISED address back, and reconnects to *that* — so the
      # app container would dial `localhost:9092`, meaning itself, and fail with a connection refused
      # naming a broker it can in fact reach. The bootstrap address being correct is precisely what
      # makes the failure confusing.
      #
      # So `kafka:29092` for containers and `localhost:9092` for the host. Both are PLAINTEXT: the
      # split is about ADDRESSING, not security. Backing-service TLS is a named gap, not scope.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      # Still `localhost:9092` — PLAINTEXT_HOST binds 0.0.0.0:9092 and this probe runs INSIDE the
      # broker container, so it exercises the same listener the host uses.
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  # BEHIND TRAEFIK, and published on no host port at all. It used to be on 8081 to match the
  # issuer-uri default; since TLS landed the proxy fronts this too, so the issuer is
  # https://auth.localhost and there is exactly one scheme and one certificate story in the stack.
  #
  # TEST FIXTURE realm: dev-only credentials, pinned user ids, never deploy.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Issue #11. WITHOUT this, Keycloak derives `iss` from the caller's Host header, so the issuer
      # is whatever the caller happened to TYPE. Measured 2026-08-08 against this exact stack:
      #
      #   token minted via 127.0.0.1:8081  ->  iss = http://127.0.0.1:8081/realms/tiny-ledger  -> 401
      #   token minted via localhost:8081  ->  iss = http://localhost:8081/realms/tiny-ledger  -> 200
      #
      # (Those were the published-port days. The lesson is unchanged and is why the hostname is
      # pinned below; only the value moved.)
      #
      # Same host, same realm, same user, two spellings of loopback, and only one authenticates.
      # Pinning the hostname makes `iss` a property of the DEPLOYMENT rather than of the request, so
      # every caller gets the same issuer no matter how it dialled in. The alternative — relaxing
      # issuer validation — throws away the check that the token came from the issuer we trust, and
      # is never acceptable to make a test pass.
      #
      # `ledger-cli/src/ledger_cli/config.py` now defaults to this SAME value; an earlier version of
      # this comment said the two disagreed and that aligning them would break the suite. They are
      # aligned and the suite passes.
      #
      # ONE variable for the auth origin, and docker-compose derives BOTH this and the application's
      # LEDGER_ISSUER_URI from it, so the two can never drift apart — they are the pair whose
      # disagreement produces a bare 401 that says nothing about which side is wrong.
      #
      # NO PORT in the default, because Traefik publishes 443. That is what a deployment's issuer
      # looks like, and it keeps the port out of the eight places that spell this string.
      # TINY_LEDGER_HTTPS_PORT and this variable MOVE TOGETHER: change the published port and this
      # must become https://auth.localhost:<that port>, or every token is refused.
      KC_HOSTNAME: ${TINY_LEDGER_AUTH_ORIGIN:-https://auth.localhost}
      # Traefik terminates TLS and speaks plain HTTP to this container. Without xforwarded, Keycloak
      # builds its URLs from that INTERNAL request and the issuer drifts back to http://keycloak:8080
      # — a value no client can reach and no token can be validated against.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Serves /health/* on the management port (9000). Measured on 26.4: the image ships
      # neither curl nor wget, so the healthcheck below reaches it through bash's /dev/tcp,
      # which is present at /usr/bin/bash.
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-tiny-ledger.json:/opt/keycloak/data/import/realm-tiny-ledger.json:ro
    # NO `ports:` — 8081 is gone, and its removal is the point rather than tidiness. A published
    # plaintext Keycloak would mint tokens whose `iss` is derived from whatever host the caller
    # typed there, which is a DIFFERENT issuer from the one the application trusts: the exact
    # 401-that-explains-nothing this stack has already measured once. One ingress, one issuer.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  # §6.6 / §14 step 9 part 3. OFF BY DEFAULT: `profiles` means a plain `docker compose up` still starts
  # exactly the four services above and this one is not among them. Turn it on with
  #
  #     set -a; . ./.env.grafana; set +a
  #     docker compose -f docker/docker-compose.yml --profile observability up -d
  #
  # and point the application at it (export is off in application.properties, so this is deliberate
  # on both sides):
  #
  #     ./mvnw spring-boot:run -Dspring-boot.run.profiles=full \
  #       -Dspring-boot.run.arguments="\
  #         --management.tracing.export.otlp.enabled=true \
  #         --management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces \
  #         --management.otlp.metrics.export.enabled=true \
  #         --management.otlp.metrics.export.url=http://localhost:4318/v1/metrics"
  #
  # The variables are read from the SHELL, exactly as `.mcp.json`'s are — nothing here loads a dotenv
  # file (AGENTS.md, "Configuration"). A missing variable makes the Collector fail to start, which is
  # the honest failure: a Collector that starts and silently drops everything is worse than one that
  # refuses.
  #
  # NOTHING IN CI RUNS THIS. Step 9's gate is OtlpExportIT, which starts its own Collector with a file
  # exporter and no credential at all.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION: ${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION}
    ports:
      - "4317:4317"
      - "4318:4318"

  # Issue #11. Until now this file had NO app service and the README told you to run the jar on the
  # host — §1's mode table said so, and it was true. The image exists now, so `full` is one command.
  #
  # `build` is absent on purpose: the image comes from `./mvnw spring-boot:build-image`, not from a
  # Dockerfile Compose could build. That keeps ONE way to produce the artefact, which is the point of
  # buildpacks here — see spec §12. Compose will not build it for you; if the tag is missing, `up`
  # fails with "pull access denied", which is the honest error rather than a silently different image.
  #
  # `profiles: [app]` keeps the default `up` at exactly the four backing services, exactly as the
  # `observability` profile above does. §6.6 and the README both assert that four-container default.
  #
  # The tag carries NO VERSION, and that is a correctness property rather than a shortcut. It used
  # to spell the version here while the pom derived its own from ${project.version}, so a bump
  # moved the built image to a new tag while this file, run-e2e.sh's guard and ci.yml's Trivy step
  # all kept naming the old one — compose would start a STALE image and the guard would confirm it
  # was there, because it was. pom.xml's <image> block carries the full reasoning and what it costs.
  #
  # The `gate` job asserts all four spell the same tag and that no version has crept back. That
  # check is why no comment in these files quotes the old versioned tag: a literal in prose would
  # be indistinguishable from a site that had drifted.
  app:
    image: tiny-ledger:local
    profiles: [app]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: full
      # SS6.5: the per-owner account cap, passed through so CI's e2e legs can turn it off with -1 --
      # they open ~7 accounts per run as `alice` and run TWICE against this same stack. The default
      # below DUPLICATES application.properties, which Compose gives no way to avoid: an unset var
      # here becomes an empty string and fails int binding at startup. Move the two together.
      LEDGER_ACCOUNTS_MAX_PER_OWNER: ${LEDGER_ACCOUNTS_MAX_PER_OWNER:-2}
      # Service names, not localhost: inside the network the app resolves its peers by name, and the
      # published host ports are irrelevant to it. Postgres is 5432 here — the CONTAINER port, which
      # TINY_LEDGER_PG_PORT never changes; that variable only moves the host-side publication.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tiny_ledger
      SPRING_DATA_REDIS_HOST: redis
      # 29092, not 9092 — see the two-listener comment on the broker above.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      #
      # THE ISSUER AND THE KEY SET ARE DELIBERATELY DIFFERENT URLS, and this is the one piece of this
      # file worth reading carefully.
      #
      # A token is minted through TRAEFIK, so Keycloak stamps `iss` as
      # https://auth.localhost/realms/tiny-ledger. The app cannot resolve that name usefully —
      # inside the network it is loopback, meaning the app itself. The tempting fixes are both wrong: relaxing issuer validation
      # throws away the check that the token came from the issuer we trust, and rewriting `iss` to
      # `keycloak:8080` breaks every host-side caller instead.
      #
      # The real answer is that `iss` and "where do I fetch the signing keys" are two different
      # questions and Boot lets them be answered separately. Verified in the shipped bytecode
      # (spring-boot-security-oauth2-resource-server-4.1.0, JwtDecoderConfiguration), not assumed
      # from docs: buildJwkSetUriJwtDecoder builds NimbusJwtDecoder.withJwkSetUri(...) and then calls
      # setJwtValidator(getValidator()), and getValidator() reads getIssuerUri() and constructs
      # `new JwtIssuerValidator(issuerUri)` alongside the `aud` validator from getAudiences().
      #
      # So issuer validation and audience validation both stay FULLY ENFORCED. Only the address the
      # key set is fetched from moves in-network. Nothing is relaxed.
      LEDGER_ISSUER_URI: ${TINY_LEDGER_AUTH_ORIGIN:-https://auth.localhost}/realms/tiny-ledger
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/tiny-ledger/protocol/openid-connect/certs
      # 300 is the PRODUCTION value (application.properties:42), restated here rather than defaulted
      # to empty — an empty environment variable is a binding failure for an int, not an unset one.
      # Only scripts/e2e/run-e2e.sh raises it, and only the backstop: the per-principal write bucket
      # stays at 100 because that bucket is what test_rate_limit is under test. Raising both would
      # make that test pass for the wrong reason, which its own comment calls the most expensive
      # kind of green.
      LEDGER_RATE_LIMIT_IP_BACKSTOP_CAPACITY: ${LEDGER_RATE_LIMIT_IP_BACKSTOP_CAPACITY:-300}
      # The ONE address this application will honour X-Forwarded-For from — Traefik's, pinned
      # below. Spec §6.1 row 4 rate-limits by client IP and IpBackstopFilter reads
      # getRemoteAddr(), so behind a proxy every request's source address becomes the proxy's. If
      # the application trusted the header from anywhere, any caller could mint a fresh 300/minute
      # bucket per request and adding TLS would have quietly REMOVED a control.
      #
      # This is why the network below has an explicit subnet and Traefik a static address: Boot's
      # DEFAULT internal-proxies list covers 172.16.0.0/12, which is the range Docker hands to
      # Compose networks — the default would trust every container on this network.
      LEDGER_TRUSTED_PROXIES: ${TINY_LEDGER_TRAEFIK_IP:-10.89.0.250}
    # NO `ports:`, and its absence is the control rather than a tidy-up.
    #
    # Publishing 8080 would leave a plaintext route straight to the application that skips Traefik
    # entirely — TLS you can walk around is decoration, and the forwarded-header trust above would
    # be pointless if callers could simply arrive on the other port. Publishing 9090 falsified
    # §6.6's own claim that the management endpoints "rely on the port not being published"; not
    # publishing it makes that sentence true again.
    #
    # Both are still reachable from INSIDE the network (Traefik dials app:8080), which is all
    # either of them needs.

  # Terminates TLS for the application AND for Keycloak. Pinned by tag AND digest for the same
  # reason the buildpack builder is: a mutable tag feeding a stack that a required check runs
  # against is a base image to patch and forget (spec §12).
  #
  # `profiles: [app]` alongside the application, so a plain `docker compose up` still starts
  # exactly the four backing services §6.6 and the README both assert.
  #
  # Keycloak IS routed through here (PR #25). One ingress, one certificate story, and no second
  # scheme in the stack — and it publishes no host port, so there is no plaintext path left that
  # could mint a token with a different `iss` from the one the application trusts. The routing
  # itself lives once, in docker/traefik/dynamic.yml.
  #
  # An earlier draft of this comment said the opposite ("deliberately NOT routed through here") and
  # survived the decision that reversed it. Replaced rather than amended: two accounts of the same
  # fact in one file is how a reader ends up restoring the published port this file removed.
  traefik:
    image: traefik:v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    profiles: [app]
    # NO depends_on. Traefik used to wait for `app`, which was harmless until E2E_MODE=jar needed
    # the proxy WITHOUT the container -- the application runs on the host in that mode, while
    # Keycloak stays behind this proxy because there is one ingress and one certificate story. The
    # file provider needs no backend to start; an absent one is a 502 on that route and nothing more.
    # THE WHOLE STATIC CONFIGURATION IS HERE, as flags, and there is deliberately no traefik.yml.
    # An earlier draft had one, and it could not work: Traefik does NOT expand ${VARS} in its own
    # config file, and — measured — when `--configFile` is given it IGNORES CLI flags entirely, so
    # the override that was meant to repair that was silently discarded. The container kept
    # answering `301 https://127.0.0.1/api/v1/accounts`, a redirect to a port nothing publishes,
    # with the flag visibly present in `docker inspect`.
    #
    # Compose DOES interpolate, so the published port reaches Traefik only from here. Nine flags
    # replaced a forty-five line file that had one job it could not do.
    #
    # The dynamic half (certificate, TLS floor, the route) stays in a file — it needs no host
    # values, and YAML is the right shape for it.
    command:
      - "--entryPoints.web.address=:80"
      # Plaintext exists ONLY to redirect, which is also the shape the ZAP baseline checks for.
      # `to` takes a PORT rather than the `websecure` entrypoint name, and must: Traefik v3 has no
      # `redirections.entryPoint.port` setting at all (checked against `traefik --help`), and
      # naming the entrypoint makes Traefik build the Location from its container-side :443 —
      # which is not the port the host published. `permanent` defaults to true.
      # `websecure`, the entrypoint name, which is correct BECAUSE the published port is now 443:
      # Traefik builds the Location from that entrypoint's :443 and omits the port, giving
      # `https://host/...`. An earlier revision published 8443 and had to pass a literal port
      # here, since Traefik v3 has no `redirections.entryPoint.port` setting at all (checked against
      # `traefik --help`) — without it the redirect pointed at a port nothing published.
      #
      # The residual, stated rather than left to be found: if TINY_LEDGER_HTTPS_PORT is moved off
      # 443, this Location still says 443. Dial the HTTPS port directly in that case; the redirect
      # is a courtesy for humans typing http://, not a path anything depends on.
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      # THE DOCKER PROVIDER IS DELIBERATELY NOT USED, which is why there is no docker.sock in the
      # volumes below. Every tutorial mounts it so routes can be discovered from service labels;
      # that socket is root-equivalent on the host. Trading it away to avoid writing one router
      # and one service by hand is a bad trade anywhere, and an absurd one in the change whose
      # whole point is not to widen a trust boundary while adding TLS.
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # The dashboard and API stay OFF (they default off; this says so out loud). An
      # unauthenticated dashboard on the edge of a ledger would be a finding in its own right.
      - "--api.dashboard=false"
      - "--api.insecure=false"
      # Access logs to stdout, so `docker compose logs traefik` answers "did the request reach the
      # proxy at all" — the first question every routing failure asks.
      - "--accesslog=true"
      - "--log.level=INFO"
    networks:
      default:
        # THE address LEDGER_TRUSTED_PROXIES names, and the reason this file declares a subnet at
        # all. Without this pin Docker allocates from the BOTTOM of the range, Traefik lands on
        # ~10.89.0.6, `internal-proxies` matches nothing, and RemoteIpValve silently no-ops — every
        # caller in the world is then metered under Traefik's address and §6.1's per-IP backstop
        # becomes one global bucket that any single client can exhaust for everyone.
        #
        # THIS BLOCK WAS DELETED ONCE, by a rewrite of the `command:` list above that spanned the
        # lines between `command:` and `volumes:`. Nothing caught it: both unit tests supply their
        # own `internal-proxies`, run-e2e.sh raises the backstop to 10000, and the by-hand spoof
        # check scores 401,401,429,429 whether the trust works or not — it is not differential.
        # `ProxyAddressPinTest` is the gate that fails now if it goes missing again.
        ipv4_address: ${TINY_LEDGER_TRAEFIK_IP:-10.89.0.250}
    volumes:
      # Read-only, both. NOTE what is NOT here: /var/run/docker.sock — see the provider flag above.
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      # Generated by scripts/tls/gen-dev-ca.sh, gitignored.
      #
      # `up` does NOT fail if it was never run, and an earlier version of this comment claimed it
      # did. Compose CREATES A DIRECTORY for a missing bind-mount source, so Traefik starts and
      # serves its own `CN=TRAEFIK DEFAULT CERT` while every request succeeds end to end — a silent
      # downgrade that only scripts/e2e/https-check.py's two-trust-store control catches, and that
      # control does not run on the plain `docker compose up` path a human follows. Run the
      # generator first; docs/pitfalls.md carries the symptom.
      - ./tls:/etc/traefik/tls:ro
    ports:
      # THE PRIVILEGED PAIR, on purpose. Keycloak sits behind this proxy now, so the published port
      # ends up inside `iss` — and 443 is the one port that does not, because it is the scheme
      # default and drops out of the URL. That keeps the issuer as `https://auth.localhost`, which
      # is what a real deployment's issuer looks like, and keeps a port number out of the eight
      # places that have to spell it identically.
      #
      # Still overridable, because a port clash here is the same silent failure TINY_LEDGER_PG_PORT
      # exists to teach. But it is NOT a free knob: move it and TINY_LEDGER_AUTH_ORIGIN must move
      # with it, exactly like the subnet/address pair below.
      - "${TINY_LEDGER_HTTPS_PORT:-443}:443"
      # Plaintext, and it only ever answers a 301 to https. Published so the redirect is something
      # a test and the ZAP baseline can actually observe rather than a claim about a config file.
      - "${TINY_LEDGER_HTTP_PORT:-80}:80"

volumes:
  postgres-data:

# An EXPLICIT subnet, which is a security control here rather than housekeeping. The application
# trusts X-Forwarded-For only from LEDGER_TRUSTED_PROXIES, and that has to name an address that
# does not move between `up` runs. Docker's own allocation would hand Traefik a different address
# per network, and the fallback — trusting the whole subnet — would extend the trust to Postgres,
# Redis, Kafka, Keycloak and the Collector for no gain.
#
# OVERRIDABLE, because the first value chosen here collided on the very first `up`. 172.28.0.0/16
# was already held by an unrelated project on this machine and Compose refused with
# "invalid pool request: Pool overlaps with other one on this address space" — which is the same
# class of failure TINY_LEDGER_PG_PORT exists for, and the reason a hardcoded value would have been
# a bug shipped to the next reader rather than a tidy default.
#
# 10.89.0.0/24 sits outside Docker's default bridge pool (the /16s it carves out of 172.17.0.0/12),
# so it does not compete with anything Docker allocates on its own, and a /24 asks for 254
# addresses rather than 65 534.
#
# Traefik takes .250, NOT .2, and that is a fix rather than a preference. Docker allocates DYNAMIC
# addresses from the bottom of the range, so the four backing services take .2 through .5 as they
# start — and a static .2 then failed with
#   failed to set up container networking: Address already in use
# on a stack that was already up. A high address stays clear of the dynamic run for the life of
# this stack. Both values are overridable together: change one and the other must move with it,
# which is why they share a comment.
networks:
  default:
    ipam:
      config:
        - subnet: ${TINY_LEDGER_SUBNET:-10.89.0.0/24}
